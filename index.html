<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mengalihkan...</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
  .box{max-width:420px;padding:32px}
  .spin{width:34px;height:34px;border:4px solid rgba(148,163,184,.25);border-top-color:#38bdf8;border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  a{color:#38bdf8}
  p{color:#94a3b8}
</style>
<script>
  // ===== ISI URL APP SCRIPT KAMU DI SINI =====
  var TARGET = "https://script.google.com/macros/s/AKfycbxd4-G_gm5usN4FXDWQNOffn-0Q4zL22HG36DnfwhnkO3AYpSKTPgSUDA1yEuV8H5JTWw/exec";
  // ===========================================

  (function () {
    if (TARGET && TARGET.indexOf("XXXX") === -1) {
      window.location.replace(TARGET);
    }
  })();
</script>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h2>Mengalihkan...</h2>
    <p>Jika tidak dialihkan otomatis,
      <a href="#" id="go">klik di sini</a>.
    </p>
    <p id="note" style="display:none;color:#fca5a5">
      Target URL belum diisi. Buka <code>redirect.html</code> lalu ubah <code>var TARGET</code>.
    </p>
  </div>
  <script>
    var target = TARGET && TARGET.indexOf("XXXX") === -1 ? TARGET : null;
    var go = document.getElementById("go");
    if (target) {
      go.href = target;
    } else {
      go.style.display = "none";
      document.getElementById("note").style.display = "block";
      var s = document.querySelector(".spin"); if (s) s.style.display = "none";
    }
  </script>
</body>
</html>
